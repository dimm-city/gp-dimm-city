title: "Dimm City — Design Guide"
authors:
  - "IT Lackey"

# Stated explicitly rather than relying on the fallback. gutterpress already
# defaults to dtrpg when no preset is given, so this changes nothing about the
# build — it just stops the warning and pins the choice.
preset: dtrpg

# The design system this guide documents, loaded IN PLACE from the repository
# it lives in: `../` is the gp-dimm-city package root (package.json, plugin.js,
# styles/, fonts/, snippets/, components.yaml). Nothing is downloaded or
# vendored, and there is no version to pin — every edit to the plugin or a
# stylesheet shows up on the next preview refresh. That is what makes this
# book the package's fixture: the test suite renders these chapters, and CI
# builds this PDF, against the working copy.
#
# A book outside this repo consumes the same package the usual way, pinned:
#   extensions:
#     - gp-dimm-city@1.0.1
extensions:
  - ../

# This book's own chrome only, unlayered like every book sheet: code
# specimens, the palette swatch grid, the #ch-example-* demo-chapter accent
# map, and the guide's frozen copies of the field-guide art classes its Part 2
# examples use.
styles:
  - styles/guide.css

source:
  files:
    # Part 1 — Using the system
    - 00-start-here.md
    - 01-writing-a-page.md
    - 02-typography.md
    - 03-palette.md
    - 04-layout.md
    - 05-text-and-callouts.md
    - 06-panels-and-cards.md
    - 07-specialty-system.md
    - 08-page-templates.md
    - 09-publishing.md
    - 10-reference.md
    - 11-variants.md
    # Part 2 — A book, page by page (Field Guide pages, verbatim)
    - 300-example-overview.md
    - 301-example-front-matter.md
    - 302-example-chapter-opener.md
    - 303-example-specialty-overview.md
    - 304-example-specialty-profile.md
    - 305-example-rules.md
    - 306-example-dm-npcs.md
    - 307-example-gear-tech.md

# The PDF's page size, which gutterpress validate/preflight check against:
# US Letter trim (8.5 × 11 in) plus DriveThruRPG's 0.125 in bleed on the
# outside, top and bottom edges = 8.625 × 11.25 in = 621 × 810 pt, the
# @page size in page-rules.css. (It said 612 × 792, the bare trim, and
# preflight failed every build on page size.)
page:
  width: 621
  height: 810
  tolerance: 0.5

validate:
  source:
    markdownlint: ../.markdownlint.jsonc

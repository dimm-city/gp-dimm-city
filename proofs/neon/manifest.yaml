title: "Dimm City — Neon print proof"
authors:
  - "IT Lackey"

# A one-page proof to order as a physical DriveThruRPG print proof before any
# neon reaches the package (docs/plans/2026-11-11-neon-signage.md). Not part
# of the published package. Regenerate the page with
#   python3 proofs/neon/make-proof.py
# and build the press PDF with
#   npx gutterpress build proofs/neon --format pdfx --out .build/neon-proof.pdf
preset: dtrpg

extensions:
  - use: ../../
    options:
      rawHtml: "off"

styles:
  - styles/neon-proof.css

chapters:
  - neon-proof.md

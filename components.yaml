    recipe: "@block panel | slate | shard | codex"
    emits: div.dc-block.dc-panel|.dc-slate|.dc-shard|.dc-codex
    css: styles/components/section.css
    notes: "Four clip-path/surface treatments on .dc-block. The variant word maps to the class in the plugin's `markers` table; `@block .dc-panel` passes the class straight through."


  # ── Core-owned structure whose public tokens this library declares ─────
  - name: section
    status: live
    origin: core
    recipe: "@section  (bare; core markers.js emits the wrapper)"
    emits: div.section
    notes: "A bare @section is core's plain box and has no variant look. This package styles no rule that names `.section` without a dc- class beside it (test/conventions.test.js); the one thing it gets, so text is never set straight on the brick wall, is a sheet of paper (cream with a hairline ink edge) keyed on the attribute, `div[class='section']`, in components/section.css. A dc- class beside `section` (a variant, .dc-avoid-split) takes it out of that rule. It splits across pages."

  - name: section-panel
    status: live
    origin: plugin
    markers: ["@section panel"]
    snippet: section-panel
    recipe: "@section panel … @end-section  (or @section .dc-section-panel)"
    emits:
      - div.section.dc-section-panel
      - p.dc-kicker (a section's last paragraph, or a paragraph right before a heading in it, when it is only a bold run: it never opens a page alone)
    css: [styles/components/section.css, styles/dc-component-defaults.css]
    tokens: [--dc-section-bg, --dc-section-accent, --dc-section-surface, --dc-section-shadow, --dc-section-clip, --dc-section-cut-tl, --dc-section-cut-br, --dc-section-cut-bl, --dc-section-rail, --dc-section-gap, --dc-section-edge, --dc-section-break-inside, --dc-section-measure, --dc-section-pad-top, --dc-section-pad-right, --dc-section-pad-bottom, --dc-section-pad-left, --dc-section-bar-mix, --dc-section-bar-tone, --dc-section-bar-fg, --dc-section-bar-rule, --dc-section-bar-rule-sub, --dc-section-flag, --dc-section-shadow-y, --dc-section-ink-mix, --dc-section-ink-tone, --dc-section-top]
    breaks: "a sheet is kept whole (--dc-section-break-inside: avoid); split a section that must run on in markup, the second part `.dc-pu-cont`"
    notes: "A sheet pasted flat on the wall (paste-up.css; constitution §IV): a band of wall above and below white paper with the accent rail and one hard shadow, the first ## or ### a tag tilted -1deg over the paper's top edge (its fill, text and under-rule are the --dc-section-bar-* tokens, which each kind sets), and a closing bold line a yellow sticker across its foot. The kinds reference, lore, dm and catalog are the same sheet with their own bar and accent. A creature (npc), the walkthrough and the choose sections are panels that keep their own card look."


  - name: street-line

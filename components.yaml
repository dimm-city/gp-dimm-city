  - name: heading-look
    status: live
    origin: author
    modifier: [dc-h3, dc-h4, dc-h5, dc-h6]
    description: "Give a heading, or a paragraph, the look of a lower level without changing its place in the outline."
    recipe: "## Useful Items {.dc-h3}  |  {.dc-h4}  |  {.dc-h5}  |  {.dc-h6}"
    emits: .dc-h3 | .dc-h4 | .dc-h5 | .dc-h6 (on the heading or paragraph it is written on)

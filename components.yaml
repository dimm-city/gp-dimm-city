    recipe: "@section panel .dc-pu-cont"
    emits:
      - .dc-pu-cont (on the section it is written on)
      - "div.dc-pu-spacer (the plugin's, ahead of a ## or ### that opens the sheet)"
    css: styles/components/paste-up.css
    tokens: [--dc-pu-band]
    notes: "The second part of a section split in markup because a sheet is never split. Its band is shallow and it has no tag. When it opens with a ## or ###, the plugin puts a zero-height `div.dc-pu-spacer` ahead of the heading so it stays a sub-head (every first-child heading rule would otherwise read it as the sheet's title); the author writes nothing extra."


    emits:
      - div.dc-outcomes[.dc-flush] > div.dc-outcomes-label
      - div.dc-outcome-row.crit|hit|mixed|miss|fail > span.dc-outcome-key.tier-* > span.dc-outcome-name + span.dc-outcome-roll

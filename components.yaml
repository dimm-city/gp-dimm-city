    css: styles/page-templates.css
    tokens: [--dc-flow-gap]
    notes: "A setter of --dc-flow-gap, the margin-bottom of a paragraph or list item inside it, to 0.04in. Unset, each component keeps its own spacing; set on a box or anything above it, it is the space under every paragraph and list item in it. Type size and leading are untouched."

  - name: heading-look

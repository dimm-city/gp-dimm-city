    notes: "A heading's level is its place in the outline and its look follows the level; the class sets the look of that level and the outline stays unbroken (`#` then `##`, never `#` then `###`). An `##` with .dc-h3 that opens a panel takes the subordinate title bar. On a paragraph it sets a line in heading type without adding it to the outline."


# Dimm City component catalog — the machine-readable ground truth for the
# component library that gp-dimm-city ships.
#
# WHAT THIS IS
#   One entry per component: what an author writes, what lands in the HTML,
#   which custom properties are public, how it fragments, and which stylesheet
#   owns it. The Dimm City Design Guide (design-guide/ in this repo)
#   explains and demonstrates the components; this file is the catalog of
#   record. It is the file package.json declares as `gutterpress.components` —
#   Gutterpress only checks that the file exists, so the schema below is this
#   package's own. Paths are relative to the package root.
#
# FIELDS
#   name (kebab, unique) · status · origin (plugin | author | core — who puts
#   the class in the DOM) · markers (the author spellings this entry covers,
#   each exactly as written: "@npc-stat", "@section npc", "@page intro",
#   "@chapter rules"; a retired entry lists the spellings that no longer
#   work) · snippet (the file or files in snippets/ that insert it, by name
#   without .md) · modifier (the class, or list of classes, an author writes
#   in `{…}` or after a marker to change a box without being a component:
#   dc-avoid-split, dc-snug, dc-chevron, dc-h3…dc-h6; the app offers each as
#   a completion) · description (one line, what an author gets from the
#   class or word; every author-facing entry and every modifier has one) ·
#   replaced_by (retired entries: what to
#   write now) · recipe · emits (DOM strings, one or a list) · css
#   (package-relative paths; required for live/unused, and at least one must
#   style one of the entry's classes) · tokens (must be declared under
#   styles/) · breaks (documentation; omitted where the component has no
#   fragmentation rule of its own — variants inherit their parent's) · usage
#   (literal strings that mark a use of a component with no marker or class:
#   `ROLL THE DIE!`, `| highlight`, …) · unstyled (emitted
#   classes acknowledged to have no CSS) · notes.
#
#   Status meanings (measured against the Dimm City books that consume this
#   package — the Field Guide, the Design Guide, SysOps):
#     live           at least one class styled; used at least once in a book;
#                    plugin-origin entries must actually be emitted/parsed
#     unused         styled or emitted, but used by no book
#     retired        no class styled, none emitted, none used
#     unimplemented  no class styled, none emitted — documented or authored,
#                    never built.
#
# THE RULE
#   Give every component an honest status, and every new macro, variant word
#   or `.dc-*` class an entry. test/integrity.test.js ("component catalog")
#   fails when:
#     - a marker in plugin.js `markers`, or a variant word on `section`,
#       `page`, `chapter` or `gear`, has no entry listing it under `markers`;
#     - an entry's `snippet` file does not exist, a snippet file belongs to no
#       entry, or a declared marker or word has an entry with no snippet;
#     - a live entry lists a `markers` spelling plugin.js does not declare, or
#       emits no class any stylesheet styles;
#     - a retired entry lists a spelling that plugin.js still declares, or
#       emits a `dc-` class a stylesheet still styles;
#     - tabbed, plain, section-allow-split, column-panel, chapter-opener or
#       sidebar-inset is missing, or is not retired with `replaced_by`.
#
# Order: plugin macros, plugin-emitted internals, author classes, unused,
# retired, unimplemented.

components:
  # ── Plugin macros and alerts ───────────────────────────────────────────
  - name: alert
    status: live
    origin: plugin
    snippet: alert
    recipe: "> [!NOTE] | > [!WARNING] | > [!DM] | > [!VIBE] | > [!ORIGIN] | > [!VISIT]  (GFM-style blockquote; the label is added automatically)"
    emits:
      - div.dc-alert.dc-note > span.dc-alert-label
      - div.dc-alert.dc-note.warning > span.dc-alert-label
      - div.dc-alert.dc-dm-note > span.dc-alert-label
      - div.dc-alert.dc-vibe-callout > span.dc-alert-label
      - div.dc-alert.dc-origin-callout > span.dc-alert-label
      - div.dc-alert.dc-visit-callout > span.dc-alert-label
    css: [styles/components/callouts.css, styles/dc-native.css]
    tokens:
      - --dc-alert-bg
      - --dc-alert-border
      - --dc-alert-fg
      - --dc-alert-label-color
      - --dc-alert-border-width
      - --dc-alert-label-size
      - --dc-alert-body-size
      - --dc-alert-label-weight
      - --dc-alert-label-spacing
      - --dc-alert-label-margin
      - --dc-alert-margin-top
    breaks: "break-inside: avoid, relaxed to auto inside a column run (@columns; dc-native.css)"
    notes: "`warning` is an unprefixed modifier on .dc-note. The blockquote form is single-block; use @callout for multi-paragraph bodies."

  - name: callout
    status: live
    origin: plugin
    markers: ["@callout"]
    snippet: [callout, callout-example]
    recipe: "@callout [note|warning|dm|vibe|origin|visit|example] label=\"…\" … @end-callout"
    emits:
      - div.dc-alert.dc-note > span.dc-alert-label
      - div.dc-alert.dc-note.warning
      - div.dc-alert.dc-dm-note
      - div.dc-alert.dc-vibe-callout
      - div.dc-alert.dc-origin-callout
      - div.dc-alert.dc-visit-callout
      - div.dc-alert.dc-example-callout
    css: styles/components/callouts.css
    breaks: "as alert"
    notes: "Same DOM and tokens as alert; the macro form allows multiple paragraphs and a custom label. The variant is a bare word (`@callout vibe`); `variant=` is no longer accepted and is reported as a problem. With no label=\"…\" the variant's name is the label."

  - name: dm-note
    status: live
    origin: plugin
    markers: ["@dm-note"]
    snippet: dm-note
    recipe: "@dm-note label=\"…\" … @end-dm-note"
    emits: div.dc-alert.dc-dm-note > span.dc-alert-label
    css: [styles/components/callouts.css, styles/dc-native.css]
    breaks: "as alert; first child glued to the box start (dc-native.css)"
    notes: "An alias of @callout with the dm variant preset: `@dm-note` is `@callout dm`. Used by the design guide only."

  - name: flavor
    status: live
    origin: plugin
    recipe: "> [!FLAVOR]"
    emits: [div.dc-flavor, "p.dc-flavor (the > blockquote inside a @skill card)"]
    css: styles/components/chrome.css
    tokens: [--dc-flavor-accent, --dc-flavor-accent-width, --dc-flavor-color]
    breaks: none

  - name: pullquote
    status: live
    origin: plugin
    recipe: "> [!PULLQUOTE]"
    emits: div.dc-pullquote.dc-flush
    css: styles/components/data.css
    tokens: [--dc-pullquote-accent, --dc-pullquote-accent-soft, --dc-pullquote-bg]
    breaks: "break-inside: avoid"

  - name: definition
    status: live
    origin: plugin
    markers: ["@definition"]
    snippet: definition
    recipe: "@definition … @end-definition  (a term, a run of `#### Term` entries as a glossary, or `#### heading` / `---` / body)"
    emits: div.dc-prose-panel.dc-definition-block
    css: styles/components/data.css
    tokens: [--dc-definition-block-surface, --dc-definition-block-accent, --dc-definition-block-accent-width]
    breaks: "break-inside: avoid (via .dc-prose-panel); a block holding several #### entries may split between them"
    notes: "The one box for a term, a glossary and a boxed note with its own heading. A run of `#### Term` entries reads as a glossary (mono-caps term, dashed rule between entries); `---` inside is the same dashed rule. It absorbed @glossary and @sidebar-box. For a plain term list a markdown definition list needs no macro."

  - name: procedure
    status: live
    origin: plugin
    markers: ["@procedure"]
    snippet: procedure
    recipe: "@procedure … 1. step … @end-procedure"
    emits: ol.dc-steps > li > span.dc-step-no
    css: styles/components/data.css
    breaks: "break-inside: avoid"
    notes: "Declared marker; no element of its own (its wrapper renders nothing), each numbered list inside is the step list. Left open at the end of the file it warns (declared_marker_eof_close); with no numbered list inside it is reported."

  - name: block
    status: live
    origin: plugin
    markers: ["@block"]
    snippet: block
    recipe: "@block panel|slate|shard label=\"Title\" … @end-block  (`.dc-panel` class form works too)"
    emits: div.dc-block > div.dc-block-title
    css: styles/components/section.css
    tokens: [--dc-block-bg, --dc-block-fg, --dc-block-accent, --dc-block-title-bg, --dc-block-title-fg]
    breaks: "break-inside: avoid"
    notes: "A declared marker: the variant word (or the .dc-* class) selects the treatment (see block-variants). The old variant=panel attribute form was dropped; no book used it. Design guide only."

  - name: block-variants
    status: live
    origin: author
    description: "The three looks of a @block: panel (HUD), slate (dark) and shard (zine)."
    recipe: "@block panel | slate | shard"
    emits: div.dc-block.dc-panel|.dc-slate|.dc-shard
    css: styles/components/section.css
    notes: "Three clip-path/surface treatments (the fourth, codex, is retired: see block-codex) on .dc-block. The variant word maps to the class in the plugin's `markers` table; `@block .dc-panel` passes the class straight through."

  - name: roll-table
    status: live
    origin: plugin
    markers: ["@roll-table"]
    snippet: roll-table
    recipe: "@roll-table [die=d20] [label=\"…\"] / | Roll | Result | table with the author's own equal bands (1-4, 5-8, …) … @end-roll-table"
    emits: div.dc-roll-table > div.dc-roll-table-caption > span.dc-roll-table-die + span.dc-roll-table-name, then the author's table
    css: styles/components/data.css
    tokens: [--dc-roll-table-accent, --dc-roll-table-surface, --dc-roll-table-head-bg]
    breaks: "the caption stays with the table (break-after: avoid); the table does not split (table break-inside: avoid)"
    notes: "A random table that is not the outcome ladder: neutral colours, one die, equal-weight rows. The die is d20 unless `die=` names another; `label` is optional. Its table is never read as a ladder, whatever its bands. Inside a skill it stays in the skill's card. (The @roll-table of 1.1 and earlier was retired in 1.2.0; this one is new.)"

  - name: card
    status: live
    origin: plugin
    markers: ["@card"]
    snippet: card
    recipe: "@card / #### Heading / > pull quote / body / > footer … @end-card"
    emits:
      - div.dc-card > div.dc-card-heading + div.dc-card-pull + div.dc-card-body
      - div.dc-card-body > blockquote.dc-card-footer (the last body blockquote, dc#44)
    css: styles/components/section.css
    breaks: "break-inside: avoid"
    notes: "Declared marker, no variants: author classes (@card .dc-flaws), #id and key=value attributes ride on the wrapper. Inside a skill it stays in the skill's card. Left open at the end of the file it closes silently."

  - name: card-variants
    status: live
    origin: plugin
    markers: ["@flaws", "@ideals", "@dreams", "@section flaws", "@section ideals", "@section dreams"]
    snippet: [flaws, ideals, dreams]
    recipe: "@flaws | @ideals | @dreams … @end-flaws | @end-ideals | @end-dreams  (or @section flaws | ideals | dreams)"
    emits: div.section.dc-section-panel.dc-section-choose.dc-flaws|.dc-ideals|.dc-dreams
    css: styles/components/section.css
    notes: "Citizen-file choices: each is a `choose` section (see section-choose) of @card blocks whose own class colors every card's left rule (`.section.dc-flaws > .dc-card`)."

  # ── Entry cards: one rule set (.dc-entry), each kind a token setter ─────
  - name: gear
    status: live
    origin: plugin
    markers: ["@gear"]
    snippet: gear
    recipe: "@gear [augment|treasure|vehicle|drug] #### Name … @end-gear  (a @gear after a @gear closes the first)"
    emits: div.dc-card.dc-entry.dc-gear
    css: styles/components/entries.css
    tokens: [--dc-entry-accent, --dc-entry-ink, --dc-entry-surface, --dc-entry-rail, --dc-entry-rule, --dc-entry-kind, --dc-entry-art-width]
    breaks: "break-inside: avoid (via .dc-card)"
    notes: "The item entry, and the one marker for every kind of item: bare `@gear` is general gear, and a bare word picks a kind (`augment`, `treasure`, `vehicle`, `drug`, the four entries below). A .dc-card of the entry family with an orange rail; the name (### or ####), the italic tagline paragraph and the bold price paragraph are picked out by shape. An image with no class in an entry is the item's picture: floated right at --dc-entry-art-width (half the card); a class the author writes (`{.gp-left .gp-large}`) places it instead. A `**SPECS:**` paragraph is a `@field specs`. Reports an entry with no name or with a second one, and a word that is not a kind (read as general gear). Not a section, so there is no `@section` word for it. A run of entries goes in a `@section catalog`; each kind is told apart by its rail colour and the small kind word over its name."

  - name: augment
    status: live
    origin: plugin
    markers: ["@gear augment"]
    snippet: augment
    recipe: "@gear augment #### Name … @end-gear"
    emits: div.dc-card.dc-entry.dc-augment
    css: styles/components/entries.css
    tokens: [--dc-entry-accent, --dc-entry-ink, --dc-entry-surface, --dc-entry-rail, --dc-entry-rule, --dc-entry-kind]
    breaks: "break-inside: avoid (via .dc-card)"
    notes: "A cybernetic or mod: cyan rail, cream surface. Same entry rules as @gear."

  - name: treasure
    status: live
    origin: plugin
    markers: ["@gear treasure"]
    snippet: treasure
    recipe: "@gear treasure #### Name … @end-gear"
    emits: div.dc-card.dc-entry.dc-treasure
    css: styles/components/entries.css
    tokens: [--dc-entry-accent, --dc-entry-ink, --dc-entry-surface, --dc-entry-rail, --dc-entry-rule, --dc-entry-kind]
    breaks: "break-inside: avoid (via .dc-card)"
    notes: "A magic item or relic: amber rail on the gold-tinted paper. Same entry rules as @gear."

  - name: vehicle
    status: live
    origin: plugin
    markers: ["@gear vehicle"]
    snippet: vehicle
    recipe: "@gear vehicle #### Name … @end-gear"
    emits: div.dc-card.dc-entry.dc-vehicle
    css: styles/components/entries.css
    tokens: [--dc-entry-accent, --dc-entry-ink, --dc-entry-surface, --dc-entry-rail, --dc-entry-rule, --dc-entry-kind]
    breaks: "break-inside: avoid (via .dc-card)"
    notes: "A vehicle: yellow rail on cold concrete. Its `**SPECS:**` line is the usual boxed strip. Same entry rules as @gear."

  - name: drug
    status: live
    origin: plugin
    markers: ["@gear drug"]
    snippet: drug
    recipe: "@gear drug #### Name … @end-gear"
    emits: div.dc-card.dc-entry.dc-drug
    css: styles/components/entries.css
    tokens: [--dc-entry-accent, --dc-entry-ink, --dc-entry-surface, --dc-entry-rail, --dc-entry-rule, --dc-entry-kind]
    breaks: "break-inside: avoid (via .dc-card)"
    notes: "A drug, elixir or other consumable: magenta rail. Its `**Effects:**` and `**Side Effects:**` paragraphs are paired field lines. Same entry rules as @gear."

  - name: field
    status: live
    origin: plugin
    markers: ["@field"]
    snippet: [field, field-specs, field-traits, field-equipment, field-effects, field-side-effects, field-requires]
    recipe: "@field [specs|traits|equipment|effects|side-effects|requires] label=\"…\" … @end-field  (or, inside a card, a paragraph that opens with **Label:**)"
    emits:
      - div.dc-field.dc-field-specs > span.dc-field-label
      - div.dc-field.dc-field-traits
      - div.dc-field.dc-field-equipment
      - div.dc-field.dc-field-effects
      - div.dc-field.dc-field-side-effects
      - div.dc-field.dc-field-requires
    css: styles/components/entries.css
    tokens: [--dc-field-accent, --dc-field-surface, --dc-field-fg, --dc-field-label-fg]
    breaks: "break-inside: avoid; a label with no text keeps with the paragraph after it"
    usage:
      - "**SPECS:**"
      - "**Traits:**"
      - "**Equipment:**"
      - "**Effects:**"
      - "**Side Effects:**"
      - "**Requires:**"
      - "**Wirephreak Gear:**"
      - "**Cybersurgeon Instrument(s):**"
      - "**TECHNOENHANCEMENT:**"
    notes: "A labelled field: a rail, a surface and a label chip, then the text beside it. The variant is a bare word and its default label is the variant's name; `label=\"…\"` replaces it, as with @callout. Inside an entry card (@gear, of any kind), @npc-stat (or @section npc) and @skill, a paragraph that opens with one of these bold labels (colon inside the bold, any case) is rewritten to exactly the markup the marker writes, keeping the author's own words as the label, so books need no change. `specs` is the one SPECS box (dark, with a yellow rail); the retired `@callout gear` and `[!GEAR]` made the same box. The labels are the FIELD_LABELS table in plugin.js: SPECS, Traits, Equipment, Effects, Side Effects, Requires, and the profession labels Wirephreak Gear, Cybersurgeon Instrument / Instruments / Instrument(s) and TECHNOENHANCEMENT (all means requires). Elsewhere the paragraph stays a paragraph. A new label is one line in that table; a new field type is a variant name there plus one token-setting rule in entries.css."

  - name: lede
    status: live
    origin: plugin
    markers: ["@lede"]
    snippet: lede
    recipe: "@lede … @end-lede"
    emits: div.dc-intro
    css: [styles/components/chrome.css, styles/components/section.css, styles/page-templates.css]
    tokens: [--dc-intro-bg, --dc-intro-accent]
    breaks: "break-after: avoid inside .dc-card-grid"
    notes: "The same .dc-intro is emitted for a learning path's subtitle and authored raw on the contents page."

  - name: tape
    status: live
    origin: author
    description: "A torn-tape divider with a label (raw HTML div)."
    recipe: "<div class=\"dc-tape\">…</div>  (add dc-flush to run edge to edge)"
    emits: div.dc-tape
    css: styles/components/chrome.css
    tokens: [--dc-tape-bg, --dc-tape-border, --dc-tape-color]
    breaks: "break-inside: avoid"
    notes: "Raw HTML only. The @tape marker was removed in 1.2.0: a one-line marker with no body and no @end- needs a selfClosing declaration core does not have yet (gutterpress#344)."

  - name: toc
    status: live
    origin: plugin
    markers: ["@toc"]
    snippet: toc
    recipe: "@toc … @end-toc  (also authored as raw <div class=\"dc-toc\">)"
    emits: div.dc-toc
    css: [styles/components/data.css, styles/page-templates.css]
    breaks: "list items break-inside: avoid"

  - name: outcome
    status: live
    origin: plugin
    markers: ["@outcome"]
    snippet: outcome
    recipe: "@outcome [flush] / 20 | Triumph | text / 11–19 | Success | text / 6–10 | Hard Choice | text / 2–5 | Failure | text / 1 | Catastrophe | text … @end-outcome, or any two-column pipe table whose first column is exactly the five bands 20, 11-19, 6-10, 2-5, 1 (any headers, either order), in a skill card or outside one"
    emits:
      - div.dc-outcomes[.dc-flush] > div.dc-outcomes-label
      - div.dc-outcome-row.crit|hit|mixed|miss|fail > span.dc-outcome-key.tier-* > span.dc-outcome-name + span.dc-outcome-roll
      - span.dc-outcome-text
    css: styles/components/data.css
    tokens:
      - --dc-outcomes-surface
      - --dc-outcomes-border
      - --dc-outcomes-inner-border
      - --dc-outcomes-divider
      - --dc-outcomes-label-bg
      - --dc-outcomes-label-color
      - --dc-outcome-key-color
      - --dc-outcome-name-color
      - --dc-outcome-name-opacity
    usage: ["| 20 |"]
    breaks: "break-inside: avoid"
    notes: "Declared marker; `flush` is its one variant (also writable .dc-flush). One row per `roll | name | text` line, coloured by position; a sixth row is a plain hit. Left open at the end of the file it warns (declared_marker_eof_close); a line that is not a row, a non-row block, or no rows at all is reported. The table form is recognised by its band values, not its headers: a table with any other set of bands (six bands, three, a split at 10) is a plain table, or an @roll-table. A table row's tier and name come from its band (20 crit, 11-19 hit, 6-10 hard choice, 2-5 miss, 1 catastrophe)."

  - name: specialty
    status: live
    origin: plugin
    markers: ["@specialty"]
    snippet: specialty
    recipe: "@specialty augmerc|proxy|streetwarden|gutterdruid|cybersurgeon|wirephreak|technosorcerer|etherlock|dualist|generalist (or .augmerc, {.augmerc}) … @end-specialty"
    emits: div.dc-specialty.<name>
    css:
      - styles/components/specialty-identity.css
      - styles/components/specialty.css
      - styles/components/cards.css
      - styles/components/data.css
      - styles/components/section.css
      - styles/page-templates.css
    tokens:
      - --spec-accent
      - --spec-mid
      - --spec-dark
      - --dc-skill-tab-shape
      - --dc-skill-body-shape
      - --dc-path-title-shape
      - --dc-path-shell-clip
      - --dc-specialty-card-shell-shape
      - --dc-specialty-intro-title-shape
      - --dc-specialty-intro-clip
    breaks: "none on the wrapper; children carry their own"
    notes: "Parent-selector model: every card, path and intro inside inherits shape and colour from .dc-specialty.<name>. Declared marker: the word and the .class spelling give the same wrapper. A new @specialty, @end-specialty, @page, @section or @chapter closes it with every path and skill inside; a skill sitting directly in it (outside a learning path) is reported."

  - name: specialty-intro
    status: live
    origin: plugin
    markers: ["@specialty-intro"]
    snippet: specialty-intro
    recipe: "@specialty-intro … @end-specialty-intro"
    emits: div.dc-specialty-intro
    css: [styles/components/specialty.css, styles/components/specialty-identity.css]
    tokens: [--dc-specialty-intro-bg, --dc-specialty-intro-title-bg, --dc-specialty-intro-title-color]
    breaks: "break-inside: avoid; first h2 break-after: avoid"

  - name: specialty-art
    status: live
    origin: plugin
    markers: ["@specialty-art"]
    snippet: specialty-art
    recipe: "@specialty-art … @end-specialty-art"
    emits: div.dc-specialty-art
    css: [styles/components/chrome.css, styles/page-rules.css]
    breaks: "break-before: page; page: full"

  - name: specialty-card
    status: live
    origin: plugin
    markers: ["@specialty-card"]
    snippet: specialty-card
    recipe: "@specialty-card … @end-specialty-card  (data-position=odd|even alternates per card)"
    emits: div.dc-specialty-card
    css:
      - styles/components/specialty.css
      - styles/components/specialty-identity.css
      - styles/components/section.css
      - styles/page-templates.css
    tokens:
      - --dc-specialty-card-bg
      - --dc-specialty-card-border
      - --dc-specialty-card-accent
      - --dc-specialty-card-fg
      - --dc-specialty-card-media-height
      - --dc-specialty-card-media-width
      - --dc-specialty-card-title-align
      - --dc-specialty-card-band-height
      - --dc-specialty-card-shadow
      - --dc-specialty-card-title-color
    breaks: "break-inside: avoid"

  - name: learning-path
    status: live
    origin: plugin
    markers: ["@learning-path"]
    snippet: learning-path
    recipe: "@learning-path / ### Title / > subtitle / - Skill A / - Skill B … @end-learning-path"
    emits:
      - div.dc-learning-path.dc-path-block > div.dc-path-shell > h3.dc-spray > span.dc-path-sticker + span.dc-path-sep
      - div.dc-path-shell > div.dc-intro
      - div.dc-stickers > span.dc-sticker > span.dc-sticker-ref
      - span.dc-arrow (between stickers)
    css: [styles/components/data.css, styles/components/chrome.css, styles/components/specialty-identity.css]
    tokens:
      - --dc-path-title-bg
      - --dc-path-title-color
      - --dc-path-accent
      - --dc-path-shell-padding-top
      - --dc-path-shell-padding-bottom
      - --dc-arrow-color
    breaks: "break-before/after: auto on the block; the h3 stays with what follows"
    notes: "Declared marker. data-path-ref is the enclosing specialty's code and the path's number in it (AUG1, PRX2; PATH1 for a specialty with no code). @end-learning-path closes the path and the skills inside it; a new @learning-path closes the previous one."

  - name: skill
    status: live
    origin: plugin
    markers: ["@skill"]
    snippet: skill
    recipe: "@skill [id=…] [{.dc-avoid-split}] / #### Name | Tier / > flavor / 1. **N AP** *Ability:* text / ##### Sub-header … @end-skill"
    emits:
      - div.dc-skill-card[name] > div.dc-card-tab > h4.dc-tab-title + span.dc-tab-tier
      - div.dc-card-body > div.dc-card-inner > p.dc-flavor + div.dc-sub-header
      - div.dc-ability > span.dc-ap + p.dc-ability-text
    css: [styles/components/cards.css, styles/components/data.css, styles/components/specialty-identity.css, styles/dc-native.css]
    tokens:
      - --dc-card-accent
      - --dc-card-surface
      - --dc-card-tab-bg
      - --dc-card-tab-title-color
      - --dc-card-body-mark
      - --dc-card-gap
      - --dc-card-tab-shadow
      - --dc-skill-card-break-inside
    breaks: "splits across pages by default (a card is a third to half a page, so whole cards left pages one card deep); a split card never opens with only its tab, an ability row is never cut, a lead-in stays with what it introduces, and the last block stays with the one above it. {.dc-avoid-split} keeps one whole, as --dc-skill-card-break-inside: avoid does"
    notes: "Declared marker. Every #### heading in one @skill is its own card, with the @skill line's classes and attributes. @end-skill closes only the skill, never the path around it. A ##### Outcomes sub-header is swallowed (the outcomes block carries its own label). Part of a card's body can sit in columns: wrap it in `@columns 2` … `@end-columns`; the run (and any `@column-break` in it) stays inside the card's .dc-card-inner, in place."


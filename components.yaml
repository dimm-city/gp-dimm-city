  # ── Core-owned structure whose public tokens this library declares ─────
  - name: section
    status: live
    origin: core
    recipe: "@section  (bare; core markers.js emits the wrapper)"
    emits: div.section
    notes: "A bare @section is core's plain box and has no variant look. This package styles no rule that names `.section` without a dc- class beside it (test/conventions.test.js); the one thing it gets, so text is never set straight on the brick wall, is a sheet of paper (cream with a hairline ink edge) keyed on the attribute, `div[class='section']`, in components/section.css. A dc- class beside `section` (a variant, .dc-avoid-split) takes it out of that rule. It splits across pages."

  - name: section-panel
    status: live
    origin: plugin
    markers: ["@section panel"]
    snippet: section-panel
    recipe: "@section panel … @end-section  (or @section .dc-section-panel)"
    emits: div.section.dc-section-panel
    css: [styles/components/section.css, styles/dc-component-defaults.css]
    tokens: [--dc-section-bg, --dc-section-accent, --dc-section-surface, --dc-section-shadow, --dc-section-clip, --dc-section-cut-tl, --dc-section-cut-br, --dc-section-cut-bl, --dc-section-rail, --dc-section-gap, --dc-section-edge, --dc-section-break-inside, --dc-section-pad-top, --dc-section-pad-right, --dc-section-pad-bottom, --dc-section-pad-left, --dc-section-bar-mix, --dc-section-bar-tone, --dc-section-bar-fg, --dc-section-bar-rule, --dc-section-bar-rule-sub, --dc-section-flag, --dc-section-shadow-y, --dc-section-ink-mix, --dc-section-ink-tone, --dc-section-top]
    breaks: "splits by default; add .dc-avoid-split to keep it whole (it sets --dc-section-break-inside: avoid and --dc-section-edge: 0px, which a book can set from its own sheet)"
    notes: "The card: cream substrate, accent rail, one larger chamfer (top right) and a chipped bottom-left corner, shadow, and the first ## or ### as a solid accent bar (magenta by default; the one kind a chapter re-themes). The bar's fill, text and under-rule are tokens (--dc-section-bar-*): a kind of section sets them (reference, lore, dm, choose, catalog) and never repaints the bar. @npc-stat, @citizen-walkthrough, @flaws, @ideals and @dreams are panels carrying their own class."


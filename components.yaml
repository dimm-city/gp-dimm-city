  - name: ap-chip
    status: live
    origin: plugin
    recipe: "1. **N AP** *Ability:* text  (inside @skill; 0 AP → .free, a single number → standard, a range, X, VAR or N+ → .variable; also authored as raw <span class=\"dc-ap\">). Only a real cost is a chip, and the chip holds only the readout (\"3 AP\", no name, no stop): number, range (hyphen or dash), X or VAR, then AP; bare **3-X** is accepted. What follows the cost moves into the row text as an italic run-in with a colon: **3 AP — Butcher Roach** → chip 3 AP + \"Butcher Roach:\"; **+1 AP per passenger.** → chip +1 AP + \"Per passenger:\"; **1 AP/100 DC Per Ego Point:** → chip 1 AP + \"1 AP/100 DC Per Ego Point:\". Variable is decided by the cost token only, plus a per-unit rate in the qualifier (per passenger, /100 DC Per …); every range prints with an en dash. Rows share one text column: a chip is at least the free chip's width. A list whose items ALL lead with a bold die result (**20**, **11-19**, **16–19: Name**) is a roll list: the outcome ladder when its bands read as one (see outcome), a .dc-roll-table plate otherwise. Any other bold lead (**Prefrontal Chaos**) is an option: a bulleted item with the name in bold and a colon; a run that does not start at 1 or sits among cost rows is bulleted too, and only a plain list from 1 stays numbered."
    emits: span.dc-ap[.free|.variable]
    css: [styles/components/cards.css, styles/components/specialty-identity.css]
    tokens: [--dc-ap-bg, --dc-ap-fg, --dc-ap-border]
    usage: [" AP**"]
    breaks: none
    notes: "The plugin emits `variable`; the CSS styles both `.variable` and the raw spelling `.var`. `.standard/.reduced/.increased/.special` (specialty-identity.css) are never emitted, only authored raw — shown in the design guide's Variant Gallery. Free is an unlit LED (grey lens, hollow lamp, ink edge), standard HUD blue, reduced pale blue with a drawn down-triangle, increased blood with a drawn up-triangle, VAR deep magenta, special amber with cream type."


# Dimm City component catalog — the machine-readable ground truth for the
# component library that gp-dimm-city ships.
#
# WHAT THIS IS
#   One entry per component: what an author writes, what lands in the HTML,
#   which custom properties are public, how it fragments, and which stylesheet
#   owns it. The Dimm City Design Guide (design-guide/ in this repo)
#   explains and demonstrates the components; this file is the catalog of
#   record. It is the file package.json declares as `gutterpress.components` —
#   Gutterpress only checks that the file exists, so the schema below is this
#   package's own. Paths are relative to the package root.
#
# FIELDS
#   name (kebab, unique) · status · origin (plugin | author | core — who puts
#   the class in the DOM) · markers (the author spellings this entry covers,
#   each exactly as written: "@npc-stat", "@section npc", "@page intro",
#   "@chapter rules"; a retired entry lists the spellings that no longer
#   work) · snippet (the file or files in snippets/ that insert it, by name
#   without .md) · modifier (the class, or list of classes, an author writes
#   in `{…}` or after a marker to change a box without being a component:
#   dc-avoid-split, dc-snug, dc-chevron, dc-h3…dc-h6; the app offers each as
#   a completion) · description (one line, what an author gets from the
#   class or word; every author-facing entry and every modifier has one) ·
#   replaced_by (retired entries: what to
#   write now) · recipe · emits (DOM strings, one or a list) · css
#   (package-relative paths; required for live/unused, and at least one must
#   style one of the entry's classes) · tokens (must be declared under
#   styles/) · breaks (documentation; omitted where the component has no
#   fragmentation rule of its own — variants inherit their parent's) · usage
#   (literal strings that mark a use of a component with no marker or class:
#   `ROLL THE DIE!`, …) · unstyled (emitted
#   classes acknowledged to have no CSS) · notes.
#
#   Status meanings (measured against the Dimm City books that consume this
#   package — the Field Guide, the Design Guide, SysOps):
#     live           at least one class styled; used at least once in a book;
#                    plugin-origin entries must actually be emitted/parsed
#     unused         styled or emitted, but used by no book
#     retired        no class styled, none emitted, none used
#     unimplemented  no class styled, none emitted — documented or authored,
#                    never built.
#
# THE RULE
#   Give every component an honest status, and every new macro, variant word
#   or `.dc-*` class an entry. test/integrity.test.js ("component catalog")
#   fails when:
#     - a marker in plugin.js `markers`, or a variant word on `section`,
#       `page`, `chapter` or `gear`, has no entry listing it under `markers`;
#     - an entry's `snippet` file does not exist, a snippet file belongs to no
#       entry, or a declared marker or word has an entry with no snippet;
#     - a live entry lists a `markers` spelling plugin.js does not declare, or
#       emits no class any stylesheet styles;
#     - a retired entry lists a spelling that plugin.js still declares, or
#       emits a `dc-` class a stylesheet still styles;
#     - tabbed, plain, section-allow-split, column-panel, chapter-opener or
#       sidebar-inset is missing, or is not retired with `replaced_by`.
#
# Order: plugin macros, plugin-emitted internals, author classes, unused,
# retired, unimplemented.

components:
  # ── Plugin macros and alerts ───────────────────────────────────────────
  - name: alert
    status: live
    origin: plugin
    snippet: alert
    recipe: "> [!NOTE] | > [!WARNING] | > [!DM] | > [!VIBE] | > [!ORIGIN] | > [!LOCATION] | > [!VISIT]  (GFM-style blockquote; the label is added automatically)"
    emits:
      - div.dc-alert.dc-note > span.dc-alert-label
      - div.dc-alert.dc-note.warning > span.dc-alert-label
      - div.dc-alert.dc-dm-note > span.dc-alert-label
      - div.dc-alert.dc-vibe-callout > span.dc-alert-label
      - div.dc-alert.dc-origin-callout > span.dc-alert-label
      - div.dc-alert.dc-location-callout > span.dc-alert-label
      - div.dc-alert.dc-visit-callout > span.dc-alert-label
    css: [styles/components/callouts.css, styles/dc-native.css]
    tokens:
      - --dc-alert-bg
      - --dc-alert-border
      - --dc-alert-fg
      - --dc-alert-label-color
      - --dc-alert-border-width
      - --dc-alert-label-size
      - --dc-alert-body-size
      - --dc-alert-label-weight
      - --dc-alert-label-spacing
      - --dc-alert-label-margin
      - --dc-alert-margin-top
      - --dc-alert-shape
      - --dc-alert-frame
      - --dc-alert-label-bg
      - --dc-alert-label-pad
    breaks: "break-inside: avoid, relaxed to auto inside a column run (@columns; dc-native.css)"
    notes: "One shell, eight registers, told apart by silhouette, fill value, edge and label (in colour and in grayscale): note (HUD blue, blue rail, machined chamfers), warning (sign-plate octagon, light cream, hazard-stripe rail, heavy ink frame with a misregistered crimson line, yellow caution-tape label), dm (ink file folder with a tab, cyan rail and chip, Dream Master only), vibe (barely violet sheet, long shallow diagonals, one violet edge, tape strip, italic), origin (warm paper, torn bottom edge, dog-ear, rust rail, worn crimson stamp label), location (origin's document in map teal: cool paper, teal rail, deep-teal stamp), visit (wobbly fungi-green signpost, map-pin label), example (ticket V notch, cyan rail, taped-on tag). Every label is a raised chip (--dc-alert-label-shadow). A `> [!NOTE]` from gutterpress-gfm-alerts (.gp-alert) is drawn as the matching callout. Every variant sets --dc-accent-ink (the text-safe accent ink) and pads every cut by its depth + 2pt. A chapter must not re-theme these tokens. `warning` is an unprefixed modifier on .dc-note. The blockquote form is single-block; use @callout for multi-paragraph bodies."

  - name: callout
    status: live
    origin: plugin
    markers: ["@callout"]
    snippet: [callout, callout-example]
    recipe: "@callout [note|warning|dm|vibe|origin|location|visit|example] label=\"…\" … @end-callout"
    emits:
      - div.dc-alert.dc-note > span.dc-alert-label
      - div.dc-alert.dc-note.warning
      - div.dc-alert.dc-dm-note
      - div.dc-alert.dc-vibe-callout
      - div.dc-alert.dc-origin-callout
      - div.dc-alert.dc-location-callout
      - div.dc-alert.dc-visit-callout
      - div.dc-alert.dc-example-callout
    css: styles/components/callouts.css
    breaks: "as alert"
    notes: "Same DOM and tokens as alert; the macro form allows multiple paragraphs and a custom label. The variant is a bare word (`@callout vibe`); `variant=` is no longer accepted and is reported as a problem. With no label=\"…\" the variant's name is the label."

  - name: dm-note
    status: live
    origin: plugin
    markers: ["@dm-note"]
    snippet: dm-note
    recipe: "@dm-note label=\"…\" … @end-dm-note"
    emits: div.dc-alert.dc-dm-note > span.dc-alert-label
    css: [styles/components/callouts.css, styles/dc-native.css]
    breaks: "as alert; first child glued to the box start (dc-native.css)"
    notes: "An alias of @callout with the dm variant preset: `@dm-note` is `@callout dm`. Used by the design guide only."

  - name: flavor
    status: live
    origin: plugin
    recipe: "> [!FLAVOR]"
    emits: [div.dc-flavor, "p.dc-flavor (the > blockquote inside a @skill card)"]
    css: styles/components/chrome.css
    tokens: [--dc-flavor-accent, --dc-flavor-accent-width, --dc-flavor-color, --dc-flavor-bg]
    breaks: none
    notes: "In-world voice: italic ink-dark text with a rail and no box; the rail is the whole container."

  - name: pullquote
    status: live
    origin: plugin
    recipe: "> [!PULLQUOTE]"
    emits: div.dc-pullquote.dc-flush
    css: styles/components/data.css
    tokens: [--dc-pullquote-accent, --dc-pullquote-accent-soft, --dc-pullquote-bg]
    breaks: "break-inside: avoid"

  - name: definition
    status: live
    origin: plugin
    markers: ["@definition"]
    snippet: definition
    recipe: "@definition … @end-definition  (a term, a run of `#### Term` entries as a glossary, or `#### heading` / `---` / body)"
    emits: div.dc-prose-panel.dc-definition-block
    css: styles/components/data.css
    tokens: [--dc-definition-block-surface, --dc-definition-block-accent, --dc-definition-block-accent-width, --dc-definition-block-shape, --dc-definition-block-fg, --dc-definition-block-term, --dc-definition-block-style, --dc-definition-block-frame, --dc-definition-block-rule-bottom, --dc-definition-block-pad]
    breaks: "break-inside: avoid (via .dc-prose-panel); a block holding several #### entries may split between them"
    notes: "The one box for a term, a glossary and a boxed note with its own heading. A dictionary page: cream, a heavy HUD-blue rule over and a hairline under, a hard shadow, no rail and no cut corners; the bold lead (`**Term:**`) is the blue headword. A run of `#### Term` entries reads as a glossary (display-caps headword, a rule between entries); `---` inside is the same rule. It absorbed @glossary and @sidebar-box. For a plain term list a markdown definition list needs no macro."

  - name: definition-lucid
    status: live
    origin: plugin
    markers: ["@definition lucid"]
    snippet: definition-lucid
    recipe: "@definition lucid #### Lucid … @end-definition"
    emits: div.dc-prose-panel.dc-definition-block.dc-definition-lucid
    css: styles/components/data.css
    tokens: [--dc-definition-block-surface, --dc-definition-block-accent, --dc-definition-block-shape, --dc-definition-block-frame, --dc-definition-block-style, --dc-definition-block-pad]
    breaks: "break-inside: avoid (via .dc-prose-panel)"
    notes: "A definition for the Lucid roll state, the opposite of surreal: the lightest sheet, four even 45-degree machined chamfers, a blue frame with a cyan hairline inside it, upright body, the headword ruled off in blue. Same markup and rules as @definition."

  - name: definition-surreal
    status: live
    origin: plugin
    markers: ["@definition surreal"]
    snippet: definition-surreal
    recipe: "@definition surreal #### Surreal … @end-definition"
    emits: div.dc-prose-panel.dc-definition-block.dc-definition-surreal
    css: styles/components/data.css
    tokens: [--dc-definition-block-surface, --dc-definition-block-accent, --dc-definition-block-shape, --dc-definition-block-fg, --dc-definition-block-term, --dc-definition-block-frame, --dc-definition-block-style, --dc-definition-block-pad]
    breaks: "break-inside: avoid (via .dc-prose-panel)"
    notes: "A definition for the Surreal roll state, the opposite of lucid: an inverted violet-black sheet with light type, a skewed outline torn along the foot, two inks (magenta and violet) off-register on opposite inner edges, a leaning headword. Same markup and rules as @definition."

  - name: procedure
    status: live
    origin: plugin
    markers: ["@procedure"]
    snippet: procedure
    recipe: "@procedure … 1. step … @end-procedure"
    emits: ol.dc-steps > li > span.dc-step-no
    css: styles/components/data.css
    tokens: [--dc-steps-accent, --dc-steps-surface]
    breaks: "the list may break between steps; a step (li) is never cut"
    notes: "An instruction plate: cream surface, 2px ink frame, hard shadow, a solid HUD-blue number strip down the left, 10pt ink step text with bold ink leads, ruled dividers; never text on the wall. Declared marker; no element of its own (its wrapper renders nothing), each numbered list inside is the step list. Left open at the end of the file it warns (declared_marker_eof_close); with no numbered list inside it is reported."

  - name: block
    status: live
    origin: plugin
    markers: ["@block"]
    snippet: block
    recipe: "@block panel|slate|shard label=\"Title\" … @end-block  (`.dc-panel` class form works too)"
    emits: div.dc-block > div.dc-block-title
    css: styles/components/section.css
    tokens: [--dc-block-bg, --dc-block-fg, --dc-block-accent, --dc-block-title-bg, --dc-block-title-fg, --dc-block-title-rule, --dc-block-tag, --dc-block-tag-edge]
    breaks: "break-inside: avoid"
    notes: "A declared marker: the variant word (or the .dc-* class) selects the treatment (see block-variants). The old variant=panel attribute form was dropped; no book used it. Design guide only."

  - name: block-variants
    status: live
    origin: author
    description: "The three looks of a @block: panel (HUD blue), slate (ink body, blood band) and shard (zine paper)."
    recipe: "@block panel | slate | shard"
    emits: div.dc-block.dc-panel|.dc-slate|.dc-shard
    css: styles/components/section.css
    notes: "Three clip-path/surface treatments (the fourth, codex, is retired: see block-codex) on .dc-block: panel is a HUD-blue band with hex corners; slate an ink body under a blood band with a crimson rule and a stamped Binding tag (not magenta, not cyan); shard light zine paper with a torn foot and a taupe label strip, no accent hue. The variant word maps to the class in the plugin's `markers` table; `@block .dc-panel` passes the class straight through."

  - name: roll-table
    status: live
    origin: plugin
    markers: ["@roll-table"]
    snippet: roll-table
    recipe: "@roll-table [die=d20] [label=\"…\"] / | Roll | Result | table with the author's own equal bands (1-4, 5-8, …) … @end-roll-table"
    emits: div.dc-roll-table > div.dc-roll-table-caption > span.dc-roll-table-die + span.dc-roll-table-name, then the author's table
    css: styles/components/data.css
    tokens: [--dc-roll-table-accent, --dc-roll-table-surface, --dc-roll-table-head-bg]
    breaks: "the caption stays with the table (break-after: avoid); the table does not split (table break-inside: avoid)"
    notes: "A random table that is not the outcome ladder: neutral colours, one die, equal-weight rows. The die is d20 unless `die=` names another; `label` is optional. Its table is never read as a ladder, whatever its bands. Inside a skill it stays in the skill's card. (The @roll-table of 1.1 and earlier was retired in 1.2.0; this one is new.)"

  - name: card
    status: live
    origin: plugin
    markers: ["@card"]
    snippet: card
    recipe: "@card / #### Heading / > pull quote / body / > footer … @end-card"
    emits:
      - div.dc-card > div.dc-card-heading + div.dc-card-pull + div.dc-card-body
      - div.dc-card-body > blockquote.dc-card-footer (the last body blockquote, dc#44)
    css: styles/components/section.css
    tokens: [--dc-card-shape, --dc-choice-accent, --dc-choice-surface, --dc-choice-tint, --dc-choice-kind, --dc-choice-edge, --dc-choice-band, --dc-choice-rail]
    breaks: "break-inside: avoid"
    notes: "Declared marker, no variants: author classes (@card .dc-flaws), #id and key=value attributes ride on the wrapper. The heading is the first `####` (core converts only a `####` to .dc-card-heading; write `####`, not `###`). A card reads its kind from the enclosing @flaws, @ideals or @dreams through the --dc-choice-* tokens (it is not styled by `.section.dc-flaws > .dc-card`); outside them it is plain ink. Inside a skill it stays in the skill's card. Left open at the end of the file it closes silently."

  - name: card-variants
    status: live
    origin: plugin
    markers: ["@flaws", "@ideals", "@dreams", "@section flaws", "@section ideals", "@section dreams"]
    snippet: [flaws, ideals, dreams]
    recipe: "@flaws | @ideals | @dreams … @end-flaws | @end-ideals | @end-dreams  (or @section flaws | ideals | dreams)"
    emits: div.section.dc-section-panel.dc-section-choose.dc-flaws|.dc-ideals|.dc-dreams
    css: styles/components/section.css
    tokens: [--dc-choice-accent, --dc-choice-surface, --dc-choice-tint, --dc-choice-kind, --dc-choice-edge, --dc-choice-band, --dc-choice-rail, --dc-card-shape]
    notes: "Citizen-file choices: each is a `choose` section (see section-choose) of @card blocks. The kind sets the --dc-choice-* tokens and the card shape, and the cards read them: flaws = blood, a cracked jagged foot and a nicked corner; ideals = HUD blue, a symmetric tablet with a rule under the name; dreams = violet, a top edge rising to the right. Each card has a rail, a top band, a one-word kind chip (FLAW, IDEAL, DREAM) and the closing quote in a kind-tinted well. With no heading the section draws nothing around the cards."

  # ── Entry cards: one rule set (.dc-entry), each kind a token setter ─────
  - name: gear
    status: live
    origin: plugin
    markers: ["@gear"]
    snippet: gear
    recipe: "@gear [augment|treasure|vehicle|drug] #### Name … @end-gear  (a @gear after a @gear closes the first)"
    emits: div.dc-card.dc-entry.dc-gear
    css: styles/components/entries.css
    tokens: [--dc-entry-accent, --dc-entry-ink, --dc-entry-surface, --dc-entry-rail, --dc-entry-rule, --dc-entry-kind, --dc-entry-art-width, --dc-entry-shape, --dc-entry-radius, --dc-entry-ornament, --dc-entry-orn-inset, --dc-entry-orn-bg, --dc-entry-orn-border, --dc-entry-orn-clip, --dc-entry-orn-z, --dc-entry-frame, --dc-entry-badge-bg, --dc-entry-badge-fg, --dc-entry-badge-shape, --dc-entry-badge-radius]
    breaks: "break-inside: avoid (via .dc-card)"
    notes: "The item entry, and the one marker for every kind of item: bare `@gear` is general gear, and a bare word picks a kind (`augment`, `treasure`, `vehicle`, `drug`, the four entries below). A .dc-card of the entry family; general gear is a hang tag (a paper card in a heavy ink frame, two clipped corners, a ring eyelet, a rust rail and badge); the name (### or ####), the italic tagline paragraph and the bold price paragraph (stamped as a dashed price tag) are picked out by shape. An image with no class in an entry is the item's picture: floated right at --dc-entry-art-width (half the card); a class the author writes (`{.gp-left .gp-large}`) places it instead. A `**SPECS:**` paragraph is a `@field specs`. Reports an entry with no name or with a second one, and a word that is not a kind (read as general gear). Not a section, so there is no `@section` word for it. A run of entries goes in a `@section catalog`; each kind is told apart by silhouette, surface value, ornament, badge and name colour (and in grayscale), not by its rail colour alone, and an entry never splits."

  - name: augment
    status: live
    origin: plugin
    markers: ["@gear augment"]
    snippet: augment
    recipe: "@gear augment #### Name … @end-gear"
    emits: div.dc-card.dc-entry.dc-augment
    css: styles/components/entries.css
    tokens: [--dc-entry-accent, --dc-entry-ink, --dc-entry-surface, --dc-entry-rail, --dc-entry-rule, --dc-entry-kind, --dc-entry-shape, --dc-entry-ornament, --dc-entry-orn-inset, --dc-entry-orn-bg, --dc-entry-orn-border, --dc-entry-orn-clip, --dc-entry-orn-z, --dc-entry-frame, --dc-entry-badge-bg, --dc-entry-badge-fg, --dc-entry-badge-shape]
    breaks: "break-inside: avoid (via .dc-card)"
    notes: "A cybernetic or mod: a spec chip, the lightest cool plate, a stepped PCB notch top-right, a 3px cyan top rule, a teal name, an arrow badge. Same entry rules as @gear."

  - name: treasure
    status: live
    origin: plugin
    markers: ["@gear treasure"]
    snippet: treasure
    recipe: "@gear treasure #### Name … @end-gear"
    emits: div.dc-card.dc-entry.dc-treasure
    css: styles/components/entries.css
    tokens: [--dc-entry-accent, --dc-entry-ink, --dc-entry-surface, --dc-entry-rail, --dc-entry-rule, --dc-entry-kind, --dc-entry-shape, --dc-entry-ornament, --dc-entry-orn-inset, --dc-entry-orn-bg, --dc-entry-orn-border, --dc-entry-orn-clip, --dc-entry-orn-z, --dc-entry-frame, --dc-entry-badge-bg, --dc-entry-badge-fg, --dc-entry-badge-shape]
    breaks: "break-inside: avoid (via .dc-card)"
    notes: "A magic item or relic: a gem, pale amethyst, an octagon cut, one hard two-tone facet, a violet rail and name, a hexagon badge. Same entry rules as @gear."

  - name: vehicle
    status: live
    origin: plugin
    markers: ["@gear vehicle"]
    snippet: vehicle
    recipe: "@gear vehicle #### Name … @end-gear"
    emits: div.dc-card.dc-entry.dc-vehicle
    css: styles/components/entries.css
    tokens: [--dc-entry-accent, --dc-entry-ink, --dc-entry-surface, --dc-entry-rail, --dc-entry-rule, --dc-entry-kind, --dc-entry-shape, --dc-entry-ornament, --dc-entry-orn-inset, --dc-entry-orn-bg, --dc-entry-orn-border, --dc-entry-orn-clip, --dc-entry-orn-z, --dc-entry-frame, --dc-entry-badge-bg, --dc-entry-badge-fg, --dc-entry-badge-shape]
    breaks: "break-inside: avoid (via .dc-card)"
    notes: "A vehicle: an industrial plate, cold concrete with chamfers, an ink inset frame, an inner seam, a yellow rail and slanted yellow badge. Its `**SPECS:**` line is the usual boxed strip. Same entry rules as @gear."

  - name: drug
    status: live
    origin: plugin
    markers: ["@gear drug"]
    snippet: drug
    recipe: "@gear drug #### Name … @end-gear"
    emits: div.dc-card.dc-entry.dc-drug
    css: styles/components/entries.css
    tokens: [--dc-entry-accent, --dc-entry-ink, --dc-entry-surface, --dc-entry-rail, --dc-entry-rule, --dc-entry-kind, --dc-entry-shape, --dc-entry-ornament, --dc-entry-orn-inset, --dc-entry-orn-bg, --dc-entry-orn-border, --dc-entry-orn-clip, --dc-entry-orn-z, --dc-entry-frame, --dc-entry-badge-bg, --dc-entry-badge-fg, --dc-entry-badge-shape]
    breaks: "break-inside: avoid (via .dc-card)"
    notes: "A drug, elixir or other consumable: a prescription label, an irregular wobbling organic outline, a lime tint, a fungi-green head band, an Rx · Drug pill badge, a green name. Its `**Effects:**` and `**Side Effects:**` paragraphs are paired field lines. Same entry rules as @gear."

  - name: field
    status: live
    origin: plugin
    markers: ["@field"]
    snippet: [field, field-specs, field-traits, field-equipment, field-effects, field-side-effects, field-requires]
    recipe: "@field [specs|traits|equipment|effects|side-effects|requires] label=\"…\" … @end-field  (or, inside a card, a paragraph that opens with **Label:**)"
    emits:
      - div.dc-field.dc-field-specs > span.dc-field-label
      - div.dc-field.dc-field-traits
      - div.dc-field.dc-field-equipment
      - div.dc-field.dc-field-effects
      - div.dc-field.dc-field-side-effects
      - div.dc-field.dc-field-requires
    css: styles/components/entries.css
    tokens: [--dc-field-accent, --dc-field-surface, --dc-field-fg, --dc-field-label-fg, --dc-field-edge-width, --dc-field-edge-style]
    breaks: "break-inside: avoid; a label with no text keeps with the paragraph after it"
    usage:
      - "**SPECS:**"
      - "**Traits:**"
      - "**Equipment:**"
      - "**Effects:**"
      - "**Side Effects:**"
      - "**Requires:**"
      - "**Wirephreak Gear:**"
      - "**Cybersurgeon Instrument(s):**"
      - "**TECHNOENHANCEMENT:**"
    notes: "A labelled field: a rail, a surface and a label chip (one slanted-edge chip for all six), then the text beside it. Effects are a solid teal frame on a pale teal ground with a + on the chip (the benefit); side effects a dashed blood frame on a pale blood ground with a – on the chip (the cost). The variant is a bare word and its default label is the variant's name; `label=\"…\"` replaces it, as with @callout. Inside an entry card (@gear, of any kind), @npc-stat (or @section npc) and @skill, a paragraph that opens with one of these bold labels (colon inside the bold, any case) is rewritten to exactly the markup the marker writes, keeping the author's own words as the label, so books need no change. `specs` is the one SPECS box (dark, with a yellow rail); the retired `@callout gear` and `[!GEAR]` made the same box. The labels are the FIELD_LABELS table in plugin.js: SPECS, Traits, Equipment, Effects, Side Effects, Requires, and the profession labels Wirephreak Gear, Cybersurgeon Instrument / Instruments / Instrument(s) and TECHNOENHANCEMENT (all means requires). Elsewhere the paragraph stays a paragraph. A new label is one line in that table; a new field type is a variant name there plus one token-setting rule in entries.css."

  - name: lede
    status: live
    origin: plugin
    markers: ["@lede"]
    snippet: lede
    recipe: "@lede … @end-lede"
    emits: div.dc-intro
    css: [styles/components/chrome.css, styles/components/section.css, styles/page-templates.css]
    tokens: [--dc-intro-bg, --dc-intro-accent, --dc-intro-color, --dc-intro-size, --dc-intro-weight, --dc-intro-style, --dc-intro-rail, --dc-intro-rule, --dc-intro-ink]
    breaks: "break-after: avoid inside .dc-card-grid"

# Dimm City component catalog — the machine-readable ground truth for the
# component library (dc#42).
#
# WHAT THIS IS
#   One entry per component: what an author writes, what lands in the HTML,
#   which custom properties are public, how it fragments, and which CSS file
#   owns it. The narrative chapters (04-components.md, 09-component-gallery.md)
#   explain and demonstrate; this file is the catalog of record. It is
#   also the file the extension package (dc#47, landed in PR #62) declares as
#   its `components:` entry in package.json — gutterpress only checks that the
#   file exists, so the schema below is this repo's own.
#
# FIELDS
#   Fields: name (kebab, unique) · status · origin (plugin | author | core —
#   who puts the class in the DOM) · recipe · emits (DOM strings, one or a
#   list) · css (paths relative to this folder; required for live/unused, and
#   at least one must style one of the entry's classes) · tokens (must be
#   declared under css/) · breaks (documentation; omitted where the component
#   has no fragmentation rule of its own — variants inherit their parent's) ·
#   usage (literal strings that mark a use of a component with no marker or
#   class: `ROLL THE DIE!`, `| highlight`, `variant=panel`, …) · unstyled
#   (emitted classes acknowledged to have no CSS) · notes.
#
#   Status meanings:
#     live           at least one class styled; used at least once in a book;
#                    plugin-origin entries must actually be emitted/parsed
#     unused         styled or emitted, but used by NEITHER book
#     retired        no class styled, none emitted, none used (a retired marker
#                    may still be parsed as a no-op stripper)
#     unimplemented  no class styled, none emitted — documented or authored,
#                    never built.
#
#   Top-level `ignore:` lists `dc-*` classes a book uses that are not
#   components, each with a reason.
#
# THE RULE
#   Give every component an honest status, and every new macro or `.dc-*`
#   class an entry. Nothing checks this file automatically, so keep it
#   accurate by hand.
#
# Order: plugin macros, plugin-emitted internals, author classes, guide-only
# classes, unused, retired, unimplemented.

components:
  # ── Plugin macros and alerts ───────────────────────────────────────────
  - name: alert
    status: live
    origin: plugin
    recipe: "> [!NOTE] | > [!WARNING] | > [!DM] | > [!VIBE] | > [!ORIGIN] | > [!VISIT] | > [!GEAR]  (GFM-style blockquote; the label is added automatically)"
    emits:
      - div.dc-alert.dc-note > span.dc-alert-label
      - div.dc-alert.dc-note.warning > span.dc-alert-label
      - div.dc-alert.dc-dm-note > span.dc-alert-label
      - div.dc-alert.dc-vibe-callout > span.dc-alert-label
      - div.dc-alert.dc-origin-callout > span.dc-alert-label
      - div.dc-alert.dc-visit-callout > span.dc-alert-label
      - div.dc-alert.dc-gear-callout > span.dc-alert-label
    css: [css/components/callouts.css, css/dc-native.css]
    tokens:
      - --dc-alert-bg
      - --dc-alert-border
      - --dc-alert-fg
      - --dc-alert-label-color
      - --dc-alert-border-width
      - --dc-alert-label-size
      - --dc-alert-body-size
      - --dc-alert-label-weight
      - --dc-alert-label-spacing
      - --dc-alert-label-margin
      - --dc-alert-margin-top
    breaks: "break-inside: avoid, relaxed to auto inside .gp-columns-2/-3 (dc-native.css)"
    notes: "`warning` is an unprefixed modifier on .dc-note. The blockquote form is single-block; use @callout for multi-paragraph bodies."

  - name: callout
    status: live
    origin: plugin
    recipe: "@callout variant=note|warning|dm|vibe|origin|visit|gear label=\"…\" … @end-callout"
    emits:
      - div.dc-alert.dc-note > span.dc-alert-label
      - div.dc-alert.dc-note.warning
      - div.dc-alert.dc-dm-note
      - div.dc-alert.dc-vibe-callout
      - div.dc-alert.dc-origin-callout
      - div.dc-alert.dc-visit-callout
      - div.dc-alert.dc-gear-callout
    css: css/components/callouts.css
    breaks: "as alert"
    notes: "Same DOM and tokens as alert; the macro form allows multiple paragraphs and a custom label."

  - name: dm-note
    status: live

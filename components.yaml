  - name: page-wall
    status: live
    origin: plugin
    markers: ["@page wall-1", "@page wall-2", "@page wall-3", "@page wall-4", "@page wall-5", "@page wall-6", "@page wall-7", "@page wall-8"]
    snippet: wall-page
    recipe: "@page wall-3   (or `.dc-page-wall-3` beside another page word: @page chapter-start .dc-page-wall-3)"
    emits: div.page.dc-page-wall-N
    css: [styles/page-rules.css, styles/dc-native.css]
    breaks: "page: dc-wall-N (dc-wall-N-<hue> in a coloured chapter)"
    notes: "A stone wall instead of the brick, over the whole sheet: 1 coursed rubble, 2 ashlar blocks, 3 random rubble, 4 running-bond brick, 5 flagstone, 6 square setts, 7 rusted steel plate (riveted plates in a running bond, brushed steel under rust patches and streaks, each plate weathered by its own amount; drawn by scripts/wall-metal.py, not cut from the sheet; a 10in tile anchored to the sheet, not the text area, with a right page carrying on from the left page's width, so its plate grid runs unbroken across a spread), 8 circuit panels falling apart (printed circuit boards screwed to the wall on a 1.25in module grid with gaps between them, in aged solder-mask greens, a teal and a tired blue: traces routed at 0/45/90 degrees, pads, vias and chip footprints, most chips gone, the boards cracked and chipped with corners broken off, mask peeled to bare glass-epoxy and tarnished, verdigrised copper, burn marks and traces dangling from the breaks; one bay has lost its panel; drawn by scripts/wall-circuit.py, anchored to the sheet as 7 is, so a spread is one wall). Walls 1 to 6 are in the brick's colours: ash (--bg) stone with grey joints, its tones matched to the brick tile's, over a --bg fill. Each tile is about 4.5in of wall with no repeat inside it (regrown from its panel), so a page shows no grid of the same stones. The chapter chip keeps its colour: each wall has a named page per hue, wired for the chapter words; a book that colours a chapter itself wires `#ch-x > .page.dc-page-wall-N { page: dc-wall-N-<hue>; }`. On a block with no .page around it (a specialty) the class goes on the block: `@specialty .augmerc .dc-page-wall-3`; it names the page on the block's children, so nothing moves, and its art plate takes the wall's margin-free page (dc-wall-N-full), so transparent art stands on that wall. 5 is bedded (its flagstones squashed into flat courses) and 6 half-lapped, so both read as walls, not paving. A page template with chrome of its own (contents, credits, intro, citizen-file) keeps its brick, and a full-bleed plate never takes a wall. Tiles 1 to 6 and the CSS for all eight are generated by scripts/wall-tiles.py from source-art/wall-sheet.png."

